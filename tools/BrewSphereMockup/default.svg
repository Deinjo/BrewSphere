<svg id="displaySvg" viewBox="0 0 240 240" role="img" aria-labelledby="display-title" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, Arial, sans-serif">

  <!-- BrewSphere display: normalized 240 x 240 source for browser and ESP32. -->
  <title id="display-title">BrewSphere Gaerungsanzeige</title>

  <!-- Text paths are kept in defs so the hardware renderer can identify them. -->
  <defs>
    <path id="attenuationArc" d="M 45,92 A 82,82 0 0,1 195,92" fill="none"/>
  </defs>

  <!-- 01_background: dark instrument face. -->
  <g id="01_background" data-layer="background">
    <circle cx="120" cy="120" r="120" fill="#0b3552"/>
  </g>

  <!-- 02_outer_rings: fixed colored gauge arcs. -->
  <g id="02_outer_rings" data-layer="outer-rings" fill="none" stroke-linecap="round">
    <!-- Full 250 degree attenuation scale. -->
    <path id="attenuationScale" d="M 29.9 183.2 A 110 110 0 1 1 210.1 183.2" stroke="#41dede" stroke-width="8"/>
    <!-- Current attenuation overlay. The mockup updates this path from 0 to 100 percent. -->
    <path id="attenuationProgress" d="M 29.9 183.1 A 110 110 0 1 1 227.4 96.2" stroke="#3d83df" stroke-width="8"/>
  </g>

  <!-- 03_scale_dots: generated by the mockup from this compact definition. -->
  <g id="03_scale_dots" data-layer="scale-dots" data-center-x="120" data-center-y="120" data-radius="97" data-start-angle="145" data-end-angle="395" data-step-percent="2.5" data-major-step-percent="10" data-small-radius="1.6" data-major-radius="2.6" data-color-break-percent="84" data-left-color="#3d83df" data-right-color="#ffe39b">
    <g id="dots"/>
  </g>

  <!-- 04_static_labels: fixed labels and separators. -->
  <g id="04_static_labels" data-layer="static-labels">
    <text font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffe39b">
      <textPath href="#attenuationArc" startOffset="50%" text-anchor="middle">
        Vergärgrad <tspan id="attenuationText">81</tspan>%
      </textPath>
    </text>
    <path d="M77 67h20 M143 67h20" fill="none" stroke="#9bb1c2" stroke-width="1"/>
    <text x="120" y="70" text-anchor="middle" fill="#e8f0f5" font-size="12" font-weight="400">PLATO</text>
  </g>

  <!-- 05_batch_panel: simple lower panel with dynamic batch information. -->
  <g id="05_batch_panel" data-layer="batch-panel">
    <path d="M34 195 L57 177 L64 174 L176 174 L183 177 L206 195 L177 216 L63 216 Z" fill="#173f5d" stroke="#62869d" stroke-width="1"/>
    <!-- Lower curved fill completes the panel surface. -->
    <path d="M 34 195 A 116 116 0 0 0 206 195" fill="#173f5d" stroke="#62869d" stroke-width="0"/>
    <!-- Separate outline keeps the curved lower edge visible. -->
    <path d="M 34 195 A 116 116 0 0 0 206 195" fill="none" stroke="#62869d" stroke-width="1"/>
    <text id="batchText" x="120" y="190" text-anchor="middle" font-size="12" font-weight="400"><tspan id="batchLabel" fill="#7b96a8">BATCH:</tspan><tspan id="batchValue" fill="#f0f4f6"> #39 Sud</tspan></text>
    <text id="recipeText" x="120" y="206" text-anchor="middle" fill="#d5e0e7" font-size="12" font-weight="400">Erdbeer-Woelkchen</text>
    <rect x="62" y="212" width="116" height="1" rx="1" fill="#62869d"/>
    <text id="dayText" x="120" y="229" text-anchor="middle" font-size="12" font-weight="400"><tspan id="dayLabel" fill="#7b96a8">TAG:</tspan><tspan id="dayValue" fill="#d5e0e7"> 13</tspan></text>
  </g>

  <!-- 06_dynamic_values: values controlled by the mockup or Brewfather API. -->
  <g id="06_dynamic_values" data-layer="dynamic-values">
    <text id="platoText" x="120" y="105" text-anchor="middle" fill="#fff1c9" font-size="35" font-weight="700">36.4 °P</text>
    <text id="targetText" x="120" y="119" text-anchor="middle" fill="#9bb1c2" font-size="6" font-weight="400">ZIEL 2.7 °P</text>
    <text id="statusText" x="120" y="135" text-anchor="middle" fill="#fff1c9" font-size="13" font-weight="700">GAERUNG</text>
    <text x="42" y="157" text-anchor="start" fill="#41dede" font-size="15" font-weight="400">S:</text>
    <text id="tempTargetText" x="87" y="157" text-anchor="end" fill="#41dede" font-size="15" font-weight="400">88.0</text>
    <text x="105" y="157" text-anchor="end" fill="#41dede" font-size="15" font-weight="400">°C</text>
    <text x="135" y="157" text-anchor="start" fill="#41dede" font-size="15" font-weight="400">I:</text>
    <text id="fridgeText" x="180" y="157" text-anchor="end" fill="#41dede" font-size="15" font-weight="400">88.0</text>
    <text x="197" y="157" text-anchor="end" fill="#41dede" font-size="15" font-weight="400">°C</text>
  </g>
</svg>
